<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Game</title>
    <link rel="stylesheet" href="pacman.css">
    <script src="pacman.js" defer></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_downward_alt,arrow_left_alt,arrow_right_alt,arrow_upward_alt" />
</head>
<body>
    <canvas id="board"></canvas>
    <!-- Điều khiển cho mobile -->
     <div class="controlPanel" id="controlPanel">
        <div class="U k" id="UP">
            <span class="material-symbols-rounded ggIcon">
                arrow_upward_alt
            </span>
        </div>
        <div class="bottom">
            <div class="L k" id="LEFT">
                <span class="material-symbols-rounded ggIcon">
                    arrow_left_alt
                </span>
            </div>
            <div class="D k" id="DOWN">
                <span class="material-symbols-rounded ggIcon">
                    arrow_downward_alt
                </span>
            </div>
            <div class="R k" id="RIGHT">
                <span class="material-symbols-rounded ggIcon">
                    arrow_right_alt
                </span>
            </div>
        </div>
     </div>
</body>
</html>
